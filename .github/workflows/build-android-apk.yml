name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de APK (release firmado con tu keystore o debug de prueba)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web
        run: |
          npm ci
          npm run build

      - name: Install Capacitor & create Android project
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Configure custom Android signing (if Secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-signing/release-keystore.jks
            cat <<EOF > android-signing/keystore.properties
          storeFile=release-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi
          node scripts/setup-android-signing.mjs

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ] && [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../LettingWork-signed.apk
            echo "APK_PATH=LettingWork-signed.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../LettingWork-debug.apk
            echo "APK_PATH=LettingWork-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LettingWork-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30
